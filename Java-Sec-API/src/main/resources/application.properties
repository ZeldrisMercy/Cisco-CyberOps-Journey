spring.application.name=java-sec-api

# ===================================================================
# SOC API - CONFIGURAÇÕES DE SEGURANÇA E BANCO DE DADOS
# ===================================================================

# 1. Conexão com o Banco de Dados (Apontando para a pasta vizinha)
spring.datasource.url=jdbc:sqlite:../SQL-Threat-DB/cyberops_soc.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# 2. Configurações do ORM (Hibernate)
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 3. Trava de Segurança (Fundamental para DevSecOps)
# O Hibernate NUNCA deve alterar a estrutura do banco (DDL). 
# Quem manda nas tabelas é o nosso script SQL Oficial. A API só lê e escreve dados.
spring.jpa.hibernate.ddl-auto=none

# 4. Porta do Servidor
server.port=8080
